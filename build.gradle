plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.rest-assured:rest-assured:5.4.0'
	testImplementation 'io.cucumber:cucumber-java:7.18.1'
	testImplementation 'io.cucumber:cucumber-spring:7.18.1'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.18.1'
	testImplementation 'org.junit.platform:junit-platform-suite'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

tasks.register('dockerComposeUp', Exec) {
	commandLine 'docker-compose', 'up', '--wait'
}

tasks.register('dockerComposeDown', Exec) {
	commandLine 'docker-compose', 'down'
}

tasks.register('cucumberTest', Test) {
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'cucumber'
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'skipped', 'failed'
		showStandardStreams = true
	}
	systemProperty 'cucumber.glue', 'gift.cucumber'
	systemProperty 'cucumber.features', 'src/test/resources/features'
	systemProperty 'cucumber.plugin', 'pretty'
	include 'gift/cucumber/**'
	exclude 'gift/acceptance/**'
	doFirst {
		logger.lifecycle('[cucumberTest] Docker Compose 시작...')
		exec {
			commandLine 'docker-compose', 'up', '--wait'
		}
		logger.lifecycle('[cucumberTest] PostgreSQL 준비 완료')
	}
	finalizedBy 'dockerComposeDown'
}
